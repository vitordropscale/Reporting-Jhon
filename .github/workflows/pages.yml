name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish. Read-only by default.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs are not cancelled, so a push that lands
# mid-deploy still publishes rather than being silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site has no build step. The repo root IS the site: index.html,
      # assets/ and data/ are uploaded exactly as they are committed.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
